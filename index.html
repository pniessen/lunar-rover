<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Lunar Rover</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="viewport">
  <canvas id="screen" width="384" height="240"></canvas>
  <div id="touch-ui">
    <div id="zone-speed"></div>
    <button id="btn-jump" type="button" aria-label="Jump">JUMP</button>
    <button id="btn-fire" type="button" aria-label="Fire">FIRE</button>
    <button id="btn-restart" type="button" aria-label="Restart run">R</button>
  </div>
  <div id="rotate-prompt" aria-hidden="true">
    <div class="rotate-icon">&#9633;</div>
    <p>ROTATE DEVICE</p>
    <p class="sub">LUNAR ROVER PLAYS IN LANDSCAPE</p>
  </div>
</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
